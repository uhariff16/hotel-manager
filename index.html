<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- SEO Meta Tags -->
    <title>StayPilot - AI-Powered Hotel & Resort Management Software</title>
    <meta name="description" content="StayPilot is an intelligent property management system for hotels, resorts, and homestays. Automate bookings, use AI for ID scanning, manage financials, and message guests via WhatsApp." />
    <meta name="keywords" content="hotel management software, resort management system, automated check-in, AI ID scanner, property management system, homestay software, hotel billing software" />
    <meta name="author" content="StayPilot" />
    <link rel="canonical" href="https://staypilot.co.in" />

    <!-- OpenGraph / Social Media Meta Tags -->
    <meta property="og:title" content="StayPilot - AI-Powered Hotel & Resort Management Software" />
    <meta property="og:description" content="Automate your resort operations with StayPilot. Features AI ID scanning, automated WhatsApp messaging, and comprehensive financial tracking." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://staypilot.co.in" />
    <meta property="og:image" content="https://staypilot.co.in/favicon.png" />
    <meta property="og:site_name" content="StayPilot" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StayPilot - AI-Powered Hotel & Resort Management Software" />
    <meta name="twitter:description" content="Automate your resort operations with StayPilot. Features AI ID scanning, automated WhatsApp messaging, and comprehensive financial tracking." />
    <meta name="twitter:image" content="https://staypilot.co.in/favicon.png" />
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.background = '#fee2e2';
        div.style.color = '#991b1b';
        div.style.padding = '1.5rem';
        div.style.borderBottom = '2px solid #f87171';
        div.style.fontFamily = 'monospace';
        div.style.zIndex = '999999';
        div.style.whiteSpace = 'pre-wrap';
        div.style.boxSizing = 'border-box';
        div.innerHTML = '<h3>Uncaught Runtime Error:</h3>' + 
                        '<p><strong>Message:</strong> ' + message + '</p>' +
                        '<p><strong>Source:</strong> ' + source + ' (Line ' + lineno + ', Col ' + colno + ')</p>' +
                        '<p><strong>Stack:</strong> ' + (error && error.stack ? error.stack : 'N/A') + '</p>';
        document.body.appendChild(div);
        return false;
      };
      window.onunhandledrejection = function(event) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.background = '#ffedd5';
        div.style.color = '#9a3412';
        div.style.padding = '1.5rem';
        div.style.borderBottom = '2px solid #fb923c';
        div.style.fontFamily = 'monospace';
        div.style.zIndex = '999999';
        div.style.whiteSpace = 'pre-wrap';
        div.style.boxSizing = 'border-box';
        div.innerHTML = '<h3>Unhandled Promise Rejection:</h3>' + 
                        '<p><strong>Reason:</strong> ' + event.reason + '</p>';
        document.body.appendChild(div);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
